repos:
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        language: system
        entry: python -m pytest -q
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff
        name: ruff
        language: system
        entry: python -m ruff check
        types: [python]
        stages: [pre-commit]
      - id: mypy
        name: mypy (CLI 层)
        language: system
        entry: python -m mypy app/integrated_app
        pass_filenames: false
        stages: [pre-commit]
