[package]
name = "matting-flash-desktop"
version = "0.1.0"
description = "Matting-Flash 桌面应用壳（Tauri v2）"
authors = ["ReSerendipity"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "Matting-Flash"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = { version = "0.4", features = ["std", "alloc"] }
chrono = "0.4"
# U 阶段：单一完整包自更新（自写 updater，校验 SHA256，NSIS /S /RELAUNCH）
reqwest = { version = "0.12", features = ["json", "native-tls", "stream"], default-features = false }
futures = "0.3"
semver = "1"
sha2 = "0.10"
