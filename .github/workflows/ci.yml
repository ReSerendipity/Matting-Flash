name: CLI Quality Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff mypy
      - name: pytest
        run: python -m pytest -q
      - name: ruff
        run: python -m ruff check
      - name: mypy (CLI 层)
        run: python -m mypy app/integrated_app
